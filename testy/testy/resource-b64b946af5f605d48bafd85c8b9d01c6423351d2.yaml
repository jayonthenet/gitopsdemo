apiVersion: humanitec.io/v1alpha1
kind: Resource
metadata:
  annotations:
    app.humanitec.io/definition-id: default-humanitec-ingress
    app.humanitec.io/definition-version-id: c7dcce9b-79d4-4236-bf7c-c3643a01dbed
    app.humanitec.io/deployment: 1852181e2388b973
    app.humanitec.io/env-type: gitops
    app.humanitec.io/matching-criteria-id: 9c92a2d495b2258e
    app.humanitec.io/resource-class: default
  creationTimestamp: null
  labels:
    app.humanitec.io/app-id: testy
    app.humanitec.io/env-id: testy
    app.humanitec.io/org-id: clearcode
  name: resource-b64b946af5f605d48bafd85c8b9d01c6423351d2
spec:
  configMapName: resource-configmap-b64b946af5f605d48bafd85c8b9d01c6423351d2
  dependsOn:
  - resource-56e777a1b6687ce5e267dd2eafff9769480bd5c4
  - resource-d986c973beb97665668e8f6b285cb10b4b2d6d8c
  - resource-fb6eeb8834dffba7326cd288a4497788acdac7a6
  driver: builtin://template
  driverInputs:
    driver:
      values:
        automatic_tls_secret_name: ${resources["tls-cert.default#modules.quickstart.externals.dns"].outputs.tls_secret_name}
        class: nginx
        host: ${resources["dns.default#modules.quickstart.externals.dns"].outputs.host}
        routePaths:
        - ${resources["route.default#modules.quickstart.externals.route"].outputs.path}
        routePorts:
        - ${resources["route.default#modules.quickstart.externals.route"].outputs.port}
        routeServices:
        - ${resources["route.default#modules.quickstart.externals.route"].outputs.service}
        templates:
          init: |
            host: {{ .resource.host | default .driver.values.host | quote }}
            ingressPaths: {{ dig  "rules" "http" (list) .resource | toRawJson }}
            tlsSecretName: {{ .driver.values.tls_secret_name | default .resource.tls_secret_name | default .driver.values.automatic_tls_secret_name | quote }}
          manifests: |
            {{- /*
              Only generate an ingress manifest if there are any routes defined.
            */ -}}
            {{- if or (gt (len .init.ingressPaths) 0) (gt (len .driver.values.routePaths ) 0) -}}
            ingress.yaml:
              location: namespace
              data:
                apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  {{- if hasKey .driver.values "annotations" }}
                  annotations:
                    {{- range $k, $v := .driver.values.annotations }}
                    {{ $k | quote }}: {{ $v | quote }}
                    {{- end}}
                  {{- end}}
                  {{- if hasKey .driver.values "labels" }}
                  labels:
                    {{- range $k, $v := .driver.values.labels }}
                    {{ $k | quote }}: {{ $v | quote }}
                    {{- end}}
                  {{- end}}
                  name: {{ .id }}-ingress
                spec:
                  {{- if .driver.values.class }}
                  ingressClassName: {{ .driver.values.class | quote }}
                  {{- end }}
                  rules:
                  - host: {{ .init.host | quote }}
                    http:
                      paths:
                      {{- /*
                        We are guaranteed that one of .init.ingressPaths or .driver.values.routePaths is
                        non-zero in length, so we don't need to deal with the empty condition.
                      */ -}}
                      {{- range $path, $rule := .init.ingressPaths }}
                      - path: {{ ternary "/" $path (eq $path "*") | quote }}
                        pathType: {{ $lcType := lower $rule.type -}}
                          {{- if eq $lcType "implementationspecific" -}}
                            {{- "ImplementationSpecific" -}}
                          {{- else if eq $lcType "exact" -}}
                            {{- "Exact" -}}
                          {{- else -}}
                            {{- "Prefix" -}}
                          {{- end }}
                        backend:
                          service:
                            name: {{ $rule.name | quote }}
                            port:
                              number: {{ $rule.port }}
                      {{- end }}
                      {{- range $index, $path := .driver.values.routePaths }}
                      - path: {{ $path | quote }}
                        {{/*
                          TODO: Check the path to choose exact or prefix
                        */}}
                        pathType: {{ $.driver.values.path_type | default "Prefix" | quote }}
                        backend:
                          service:
                            name: {{ index $.driver.values.routeServices $index  | quote }}
                            port:
                              number: {{ index $.driver.values.routePorts $index }}
                      {{- end }}
                  {{- if not (or .driver.values.no_tls (eq .init.tlsSecretName "")) }}
                  tls:
                  - hosts:
                    - {{ .init.host | quote }}
                    secretName: {{ .init.tlsSecretName | quote }}
                  {{- end }}
            {{- end -}}
          outputs: |
            no_tls: {{ .driver.values.no_tls | default false }}
            id: {{ .id }}-ingress
  driverType: humanitec/template
  guresid: b64b946af5f605d48bafd85c8b9d01c6423351d2
  id: modules.quickstart.externals.dns
  secretName: resource-secret-b64b946af5f605d48bafd85c8b9d01c6423351d2
  type: ingress
  workloadPatchName: resource-patch-b64b946af5f605d48bafd85c8b9d01c6423351d2
status: {}
